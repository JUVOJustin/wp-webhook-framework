name: Dependabot / Classify

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-classify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Verify metadata without checking out or executing PR-controlled code.
      - name: Verify Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
      - name: Record eligibility on this exact commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              context: 'Dependabot patch eligibility',
              state: 'success',
              description: process.env.UPDATE_TYPE === 'version-update:semver-patch'
                ? 'Verified patch update' : 'Manual review required'
            });
