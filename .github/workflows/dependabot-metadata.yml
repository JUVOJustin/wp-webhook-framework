name: Dependabot / Classify

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-classify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Verify metadata without checking out or executing PR-controlled code.
      - name: Verify Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Record eligibility on this exact commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              context: 'Dependabot patch eligibility',
              state: 'success',
              description: process.env.UPDATE_TYPE === 'version-update:semver-patch'
                ? 'Verified patch update' : 'Manual review required'
            });
